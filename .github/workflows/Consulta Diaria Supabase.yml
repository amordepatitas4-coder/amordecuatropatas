name: Supabase Health Check & Keep-Alive Diario

# Este flujo de trabajo ejecuta una consulta programada diaria contra Supabase
# para mantener activa la base de datos y evitar la suspensión por inactividad
# de la capa gratuita (Free Tier).

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC (05:00 AM hora de Chile)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  keep-alive:
    name: Consulta Diaria de Disponibilidad
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar consulta ligera de verificación a Supabase
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "⚠️ Variables SUPABASE_URL o SUPABASE_ANON_KEY no configuradas en GitHub Secrets."
            echo "ℹ️ Se simula la consulta de mantenimiento para registro de disponibilidad."
            exit 0
          fi

          echo "📡 Realizando consulta diaria de disponibilidad a Supabase..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/animales?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Código de respuesta HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Base de datos activa y respondiendo correctamente. Proyecto mantenido despierto."
          else
            echo "⚠️ Advertencia en consulta diaria. Código: $HTTP_CODE. Detalle: $BODY"
          fi
